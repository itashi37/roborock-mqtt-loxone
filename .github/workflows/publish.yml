name: Test and publish GHCR image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/itashi37/roborock-mqtt-loxone

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml
      - name: Test backend
        working-directory: app
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
      - name: Test frontend
        working-directory: app/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Validate container tag policy
        run: ./scripts/container-tags_test.sh

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and validate tags
        id: release
        run: |
          tags=$(./scripts/container-tags.sh "$GITHUB_REF" "$IMAGE")
          version=edge
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF#refs/tags/v}; fi
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo EOF
            echo "version=$version"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64/arm64 manifest
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.release.outputs.created }}
          labels: |
            org.opencontainers.image.title=roborock-mqtt-loxone
            org.opencontainers.image.description=Roborock bridge for MQTT and Direct Loxone integrations
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
